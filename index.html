<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser SQL Agent</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">실행 예제</p>
        <h1>Browser SQL Agent</h1>
        <p>CSV에 대해 질문하면 서버 Agent가 요청을 처리하고, DuckDB가 이 탭에서 SQL을 실행합니다.</p>
      </header>
      <form id="ask">
        <div class="source">
          <label for="file">매출 CSV <small>category, region, amount</small></label>
          <input id="file" type="file" accept=".csv,text/csv">
          <button id="sample" type="button" class="secondary">예제 데이터 사용</button>
          <span id="source-name">합성 매출 데이터</span>
        </div>
        <label for="question">질문 <small id="mode"></small></label>
        <div class="presets" aria-label="예시 질문">
          <button type="button" data-example="category">카테고리별 매출</button>
          <button type="button" data-example="region">지역별 매출</button>
          <button type="button" data-example="total">전체 매출</button>
        </div>
        <div class="question">
          <input id="question" name="question" value="카테고리별 매출 합계는 얼마인가요?" required maxlength="600">
          <button id="run" type="submit" disabled>분석 실행</button>
        </div>
        <p class="privacy">파일은 이 탭에 남습니다. 질문과 집계 결과 최대 10행은 서버로 전송되며, 모델 모드에서는 모델 제공자에게도 전달됩니다.</p>
      </form>
      <p id="status" role="status">DuckDB를 시작하는 중입니다…</p>
      <section aria-labelledby="answer-label">
        <h2 id="answer-label">답변</h2>
        <p id="answer">분석을 실행하면 답변이 표시됩니다.</p>
      </section>
      <section aria-labelledby="trace-label">
        <h2 id="trace-label">실행 흐름과 전송 내용</h2>
        <ol id="trace"><li>질문을 입력해 주세요.</li></ol>
      </section>
    </main>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
